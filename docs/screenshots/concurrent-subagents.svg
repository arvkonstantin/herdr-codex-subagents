<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Concurrent Codex subagents in Herdr</title>
  <desc id="desc">A Herdr workspace where three viewers successively split the right side without changing focus</desc>
  <defs>
    <linearGradient id="window2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="720" fill="#070b15"/>
  <circle cx="1280" cy="30" r="270" fill="#7c3aed" opacity=".13"/><circle cx="70" cy="700" r="250" fill="#0891b2" opacity=".1"/>
  <g filter="url(#shadow2)"><rect x="55" y="54" width="1290" height="612" rx="18" fill="url(#window2)" stroke="#334155"/><path d="M55 106h1290" stroke="#334155"/></g>
  <circle cx="89" cy="80" r="7" fill="#fb7185"/><circle cx="113" cy="80" r="7" fill="#fbbf24"/><circle cx="137" cy="80" r="7" fill="#34d399"/>
  <text x="700" y="86" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="17">HERDR / three concurrent subagents</text>
  <rect x="73" y="124" width="430" height="524" rx="10" fill="#090e19" stroke="#334155"/>
  <rect x="516" y="124" width="360" height="524" rx="10" fill="#090e19" stroke="#22d3ee"/>
  <rect x="889" y="124" width="264" height="524" rx="10" fill="#090e19" stroke="#a78bfa"/>
  <rect x="1166" y="124" width="161" height="524" rx="10" fill="#090e19" stroke="#c4b5fd"/>
  <text x="98" y="160" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="17">&gt; CODEX / parent</text>
  <text x="98" y="210" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="17">Implement, review, and document.</text>
  <text x="98" y="275" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="15">-&gt; implementer</text>
  <text x="98" y="308" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="15">-&gt; reviewer</text>
  <text x="98" y="341" fill="#ddd6fe" font-family="ui-monospace, monospace" font-size="15">-&gt; documenter</text>
  <text x="98" y="602" fill="#64748b" font-family="ui-monospace, monospace" font-size="15">focused |</text>
  <text x="540" y="160" fill="#22d3ee" font-family="ui-monospace, monospace" font-size="16">IMPLEMENTER</text>
  <text x="540" y="209" fill="#34d399" font-family="ui-monospace, monospace" font-size="15">* working</text>
  <text x="540" y="260" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="14">Building lifecycle map.</text>
  <text x="540" y="311" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="14">$ pytest -q</text>
  <text x="540" y="346" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="14">~ files (2)</text>
  <text x="913" y="160" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="16">REVIEWER</text>
  <text x="913" y="209" fill="#34d399" font-family="ui-monospace, monospace" font-size="15">* working</text>
  <text x="913" y="260" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="14">Checking focus</text>
  <text x="913" y="284" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="14">and close safety.</text>
  <text x="1190" y="160" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="14">DOCS</text>
  <text x="1190" y="209" fill="#34d399" font-family="ui-monospace, monospace" font-size="14">* live</text>
  <text x="1190" y="260" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="13">README</text>
  <text x="1190" y="286" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="13">badges</text>
  <path d="M503 386h13M876 386h13M1153 386h13" stroke="#475569" stroke-width="3"/>
  <text x="922" y="617" fill="#64748b" font-family="ui-monospace, monospace" font-size="13">B closes -&gt; only B pane disappears</text>
</svg>
