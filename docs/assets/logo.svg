<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Herdr Codex Subagents</title>
  <desc id="desc">Three terminal panes branching from a central Codex spark</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="36" fill="url(#bg)"/>
  <rect x="23" y="39" width="48" height="82" rx="8" fill="#0b1020" stroke="#67e8f9" stroke-width="3"/>
  <rect x="80" y="51" width="27" height="58" rx="6" fill="#0b1020" stroke="#a78bfa" stroke-width="3"/>
  <rect x="116" y="60" width="21" height="40" rx="5" fill="#0b1020" stroke="#c4b5fd" stroke-width="3"/>
  <path d="M33 52h28M33 62h18M89 64h9M89 74h9M123 72h7M123 82h7" stroke="#dbeafe" stroke-width="3" stroke-linecap="round" opacity=".82"/>
  <path d="M71 80h9M107 80h9" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76" cy="80" r="4" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="112" cy="80" r="4" fill="#a78bfa" filter="url(#glow)"/>
</svg>
