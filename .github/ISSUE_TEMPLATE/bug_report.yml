name: Bug report
description: Report a problem with the plugin.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Plugin, Codex, Herdr, Python, and operating-system versions, if relevant.
